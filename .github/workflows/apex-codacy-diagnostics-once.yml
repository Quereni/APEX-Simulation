name: APEX - Diagnostico temporario Codacy

on:
  push:
    branches: [diagnostics/codacy-annotations-2026-11]

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  read-codacy-annotations:
    name: Inspecionar anotacoes de cinco PRs
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ler check runs e anotacoes sem modificar PRs
        shell: bash
        run: |
          set -euo pipefail
          echo "APEX_CODACY_DIAGNOSTIC_START"
          for pr in 9 11 15 16 17; do
            echo "===== PR #${pr} ====="
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.head.sha')"
            echo "HEAD_SHA=${sha}"
            check_id="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "Codacy Static Code Analysis")] | sort_by(.started_at) | last | .id // empty')"
            if [[ -z "${check_id}" || "${check_id}" == "null" ]]; then
              echo "NO_CODACY_CHECK_RUN"
              continue
            fi
            echo "CODACY_CHECK_RUN_ID=${check_id}"
            gh api "repos/${GITHUB_REPOSITORY}/check-runs/${check_id}/annotations?per_page=100" \
              --jq '.[] | {path, start_line, end_line, annotation_level, title, message}' || echo "ANNOTATION_REQUEST_FAILED"
          done
          echo "APEX_CODACY_DIAGNOSTIC_DONE"
